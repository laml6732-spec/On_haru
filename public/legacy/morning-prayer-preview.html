<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>On_HARU · 아침기도 디자인 미리보기</title>
<link rel="stylesheet" href="./morning-prayer-anchor.v1.css?rev=penReference20261121a">
<style>
:root{color-scheme:light;--ocean-ink:#103449;--ocean-sub:#244b60}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-width:320px;font-family:system-ui,'Apple SD Gothic Neo',sans-serif;background:#e4f7fb;color:var(--ocean-ink)}
.demo-shell{min-height:100svh;position:relative;isolation:isolate;overflow:hidden;background:#dff6fb}
.demo-shell:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(rgba(240,251,255,.12),rgba(240,251,255,.12)),url('./assets/kona-focus-ocean-morning.png') center/cover no-repeat}
.demo-head{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:14px;right:14px;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:cursive;font-size:23px;font-weight:700;font-style:italic;letter-spacing:-1.7px}
.brand em{font:400 15px serif;color:#d59a64}

.hide-timer{position:absolute;top:calc(env(safe-area-inset-top) + 66px);right:22px;border:0;background:transparent;font:400 12px system-ui;color:var(--ocean-sub);padding:8px;cursor:pointer}
.app #page-focus{position:relative;min-height:100svh}
.app #page-focus .focus-clock-area{position:absolute;top:47.8%;left:14px;right:14px;transform:translateY(-50%);text-align:center;display:flex;align-items:center;flex-direction:column}
#timerStatus{display:block;color:var(--ocean-sub);font-size:12px;font-weight:500;letter-spacing:.04em;margin:0 auto 14px!important}
body.focus-immersive.morning-prayer-running .app #page-focus #morningPrayerListeningMessage{order:1;width:min(100%,370px)!important;margin:0 auto 24px!important}
#focusClock{order:2;font-family:Manrope,system-ui,sans-serif;font-size:clamp(64px,19vw,92px);font-weight:300;letter-spacing:-.045em;font-variant-numeric:tabular-nums;color:var(--ocean-ink);line-height:1.3}
.progress{order:3;width:180px;max-width:62%;height:3px;margin:21px auto 0;background:#24566b50;position:relative}
.progress span{display:block;width:6px;height:3px;background:#103449}
.actions{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 13px);left:16px;right:16px;display:flex;flex-direction:column;align-items:center;gap:6px}
.actions .row{display:flex;width:100%;gap:8px;height:48px}
.actions button{border-radius:14px;min-height:44px;border:1px solid #173d5459;background:#effaff;color:#103449;font:500 14px system-ui;cursor:pointer}
#pause{flex:1.35;background:#123e56;color:#f4fbff}
#end{flex:.54}
#more{width:44px;font-size:22px}
#noteToggle{padding:0 15px;font-size:12px}
.note{position:absolute;top:53%;left:16px;right:16px;bottom:116px;border:1px solid #173d5459;background:#effaffe9;border-radius:15px;padding:12px;color:var(--ocean-ink);font:15px/1.5 system-ui;resize:none}
.note[hidden]{display:none}
body.note-on .focus-clock-area{top:28%!important}
body.note-on #morningPrayerListeningMessage{display:none!important}
body.note-on #focusClock{font-size:64px}
.tools{background:#f9faf7;padding:18px max(16px,calc((100% - 440px)/2));font:14px/1.55 system-ui}
.tools p{margin:0 0 12px;color:#42657a}
.tools .links{display:flex;flex-wrap:wrap;gap:8px}
.tools button,.tools a{border:1px solid #8da8af;border-radius:9px;color:#163f51;background:#fff;font:600 14px system-ui;padding:11px 14px;text-decoration:none;cursor:pointer}
.tools a{background:#123e56;color:white;border-color:#123e56}
#previewCount{font-size:12px;color:#42657a;display:block;margin-top:9px}
@media(max-height:700px){.app #page-focus .focus-clock-area{top:46%}#focusClock{font-size:68px}.progress{margin-top:15px}}
@media(max-width:360px){.demo-head{left:12px;right:12px}.app #page-focus .focus-clock-area{left:12px;right:12px}}
@media(prefers-reduced-motion:no-preference){.actions button:active{transform:scale(.985)}}
</style>
</head>
<body class="focus-immersive morning-prayer-running" data-focus-ocean="morning">
<main class="app demo-shell" aria-label="아침기도 화면 디자인 미리보기">
  <header class="demo-head"><span class="brand">On_HARU <em>✿</em></span></header>
  <button class="hide-timer" id="hideTimer" type="button" aria-pressed="false">타이머 숨기기</button>
  <section id="page-focus" class="page active">
    <div class="focus-clock-area">
      <p id="timerStatus">기도 중</p>
      <p id="morningPrayerListeningMessage" aria-label="오늘의 기도문"></p>
      <div id="focusClock" aria-label="남은 시간">10:00</div>
      <div class="progress" aria-hidden="true"><span></span></div>
    </div>
    <textarea id="note" class="note" hidden placeholder="생각을 남겨보세요. 이 미리보기의 메모는 저장되지 않아요."></textarea>
    <div class="actions">
      <div class="row"><button type="button" id="pause">일시 정지</button><button type="button" id="end">종료</button><button type="button" id="more" aria-label="미리보기 안내">···</button></div>
      <button type="button" id="noteToggle">생각 남기기</button>
    </div>
  </section>
</main>
<footer class="tools" aria-label="디자인 확인 도구">
  <p>디자인 확인용 화면입니다. 실제 기도 기록은 저장되지 않습니다.</p>
  <div class="links"><button id="next" type="button">다른 기도문 보기</button><a href="./">앱에서 기도 시작</a></div>
  <span id="previewCount"></span>
</footer>
<script src="./runtime/morning-prayer-rotation.v1.js?rev=morninghand8c"></script>
<script>
(() => {
 'use strict';
 const lib=window.OnHaruMorningPrayer;
 const now=new Date(),date=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');
 const picked=lib.pick(date);let index=lib.copy.findIndex(x=>x.id===picked.id);
 const message=document.getElementById('morningPrayerListeningMessage');
 let seconds=600,paused=true,noteOpen=false,hideClock=false;
 const timer=document.getElementById('focusClock'),button=document.getElementById('pause');
 function draw(){lib.draw(message,lib.copy[index]);document.getElementById('previewCount').textContent='기도문 '+(index+1)+' / 8 · 실제 앱에서는 매일 하나씩 고정';}
 function tick(){if(paused||seconds===0)return;seconds=Math.max(0,seconds-1);timer.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');if(!seconds){paused=true;button.textContent='계속하기';}}
 draw();
 button.onclick=()=>{paused=!paused;button.textContent=paused?'계속하기':'일시 정지';};
 document.getElementById('end').onclick=()=>{seconds=600;paused=true;timer.textContent='10:00';button.textContent='일시 정지';};
 document.getElementById('noteToggle').onclick=()=>{noteOpen=!noteOpen;document.body.classList.toggle('note-on',noteOpen);document.getElementById('note').hidden=!noteOpen;document.getElementById('noteToggle').textContent=noteOpen?'메모 닫기':'생각 남기기';};
 document.getElementById('more').onclick=()=>alert('이 페이지는 디자인만 확인하는 미리보기입니다. 기도 기록을 저장하려면 아래 “앱에서 기도 시작”을 누르세요.');
 document.getElementById('hideTimer').onclick=()=>{hideClock=!hideClock;timer.hidden=hideClock;document.querySelector('.progress').hidden=hideClock;document.getElementById('hideTimer').textContent=hideClock?'타이머 보기':'타이머 숨기기';document.getElementById('hideTimer').setAttribute('aria-pressed',String(hideClock));};
 document.getElementById('next').onclick=()=>{index=(index+1)%lib.copy.length;draw();window.scrollTo({top:0,behavior:'smooth'});};
 setInterval(tick,1000);
})();
</script>
</body>
</html>
