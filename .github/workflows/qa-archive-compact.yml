name: On_HARU Archive compact UI QA
on:
  push:
    branches: ['fix/archive-compact-toolbar-2026-11-05']
    paths: ['public/legacy/**', 'scripts/qa-archive-compact.mjs', '.github/workflows/qa-archive-compact.yml']
  workflow_dispatch:
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - run: command -v google-chrome >/dev/null || npx playwright-core install chromium
      - run: node scripts/verify-ui-static.mjs
      - run: python3 -m http.server 8080 --directory public > /tmp/onharu-archive.log 2>&1 &
      - run: node scripts/qa-archive-compact.mjs
      - run: node scripts/qa-review-hierarchy.mjs
      - run: node scripts/qa-review-overall.mjs
      - run: node scripts/ui-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onharu-archive-compact-visual
          path: |
            test-results/archive-compact/
            test-results/review-hierarchy/
            test-results/review-overall/
            test-results/onharu-ui/
          retention-days: 14
