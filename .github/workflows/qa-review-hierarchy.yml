name: On_HARU Review Weekly Archive hierarchy QA
on:
  push:
    branches: [main, 'fix/review-weekly-archive-hierarchy-2026-11-05', 'fix/review-hierarchy-qa-compat-2026-11-05']
    paths: ['public/legacy/**','scripts/qa-review-hierarchy.mjs','.github/workflows/qa-review-hierarchy.yml']
  workflow_dispatch:
jobs:
  review-hierarchy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - run: command -v google-chrome >/dev/null || npx playwright-core install chromium
      - run: node scripts/verify-ui-static.mjs
      - run: python3 -m http.server 8080 --directory public > /tmp/onharu-review-hierarchy.log 2>&1 &
      - run: node scripts/qa-review-hierarchy.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onharu-review-hierarchy
          path: test-results/review-hierarchy/
          retention-days: 14
