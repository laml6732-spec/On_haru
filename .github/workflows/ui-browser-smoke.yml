name: OnHaru isolated browser smoke
on:
  workflow_dispatch:
  push:
    branches: ['work/css-audit-regression-2026-11']
    paths: ['.github/workflows/ui-browser-smoke.yml', 'scripts/ui-*.mjs', 'public/legacy/**']
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/verify-ui-static.mjs
      - run: python3 -m http.server 8080 --directory public > /tmp/onharu-server.log 2>&1 &
      - run: node scripts/ui-smoke.mjs
        env:
          ONHARU_URL: http://127.0.0.1:8080/legacy/
      - run: |
          git fetch origin 4cdbcdb6e421794ee022bef4da251faef58f4669
          git show FETCH_HEAD:public/legacy/app.7cb1b71d4eb6.css > /tmp/onharu-baseline.css
          ONHARU_CSS_OVERRIDE=/tmp/onharu-baseline.css ONHARU_ARTIFACTS=test-results/before node scripts/ui-matrix.mjs
        continue-on-error: true
        env:
          ONHARU_URL: http://127.0.0.1:8080/legacy/
      - run: ONHARU_ARTIFACTS=test-results/after node scripts/ui-matrix.mjs
        continue-on-error: true
        env:
          ONHARU_URL: http://127.0.0.1:8080/legacy/
      - run: node scripts/ui-extra.mjs
        if: always()
      - run: node scripts/ui-pwa.mjs
        if: always()
      - run: node scripts/compare-ui-matrix.mjs
        if: always()
      - uses: actions/upload-artifact@v4
        id: evidence
        if: always()
        with:
          name: ui-smoke-screenshots
          path: test-results/

          retention-days: 7
      - name: Save reviewable results on audit branch
        if: always() && github.ref == 'refs/heads/work/css-audit-regression-2026-11'
        run: |
          mkdir -p docs/ui-audit-2026-11
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const read=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return null}};
          const result={runId:process.env.GITHUB_RUN_ID,sourceCommit:process.env.GITHUB_SHA,url:'https://github.com/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID,before:read('test-results/before/report.json'),after:read('test-results/after/report.json'),extra:read('test-results/extra/report.json'),pwa:read('test-results/pwa/report.json'),smoke:read('test-results/onharu-ui/report.json'),comparison:read('test-results/comparison.json')};
          fs.writeFileSync('docs/ui-audit-2026-11/CI_RESULTS.json',JSON.stringify(result,null,2));
          JS
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ui-audit-2026-11/CI_RESULTS.json
          git diff --cached --quiet || git commit -m "evidence: record isolated CSS audit results"
          git push origin HEAD:work/css-audit-regression-2026-11
