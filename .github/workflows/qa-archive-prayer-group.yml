name: On_HARU Archive daily grouping and Prayer notes QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'public/legacy/**'
      - 'scripts/qa-archive-prayer-group.mjs'
      - '.github/workflows/qa-archive-prayer-group.yml'
  push:
    branches: ['fix/archive-daily-group-prayer-topic-20261113']
    paths:
      - 'public/legacy/**'
      - 'scripts/qa-archive-prayer-group.mjs'
      - '.github/workflows/qa-archive-prayer-group.yml'
  workflow_dispatch:
jobs:
  archive-prayer:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - run: npx playwright-core install --with-deps chromium
      - run: node --check public/legacy/runtime/legacy-controllers.9a6fbb5e22cc.js
      - run: node --check scripts/qa-archive-prayer-group.mjs
      - run: node scripts/verify-ui-static.mjs
      - run: python3 -m http.server 8080 --directory public > /tmp/onharu-archive-qa-http.log 2>&1 &
      - run: node scripts/qa-archive-prayer-group.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onharu-archive-prayer-qa
          path: test-results/archive-prayer-group/
          retention-days: 14
