name: Review 7-day calendar modes QA
on:
  push:
    branches:
      - feature/review-v2-calendar-7day-collapse-month-20261106
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check public/legacy/runtime/legacy-controllers.9a6fbb5e22cc.js
      - run: node --check scripts/qa-review-v2-calendar.mjs
      - run: node scripts/verify-ui-static.mjs
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - run: npx playwright-core install --with-deps chromium
      - run: python3 -m http.server 8080 --directory public > /tmp/onharu-server.log 2>&1 &
      - run: node scripts/qa-review-v2-calendar.mjs
        env:
          ONHARU_URL: http://127.0.0.1:8080/legacy/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-calendar-7day-screenshots
          path: test-results/review-v2-calendar/
          retention-days: 7
