name: On_HARU Review provenance labels and CSS audit
on:
  push:
    branches: [main, 'fix/review-labels-css-audit-2026-11-05']
    paths: ['public/legacy/**', 'scripts/qa-review-labels.mjs', '.github/workflows/qa-review-labels.yml']
  workflow_dispatch:
jobs:
  review-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - run: command -v google-chrome >/dev/null || npx playwright-core install chromium
      - run: node scripts/verify-ui-static.mjs
      - run: node scripts/audit-css.mjs --json > review-css-inventory.json
      - run: python3 -m http.server 8080 --directory public > /tmp/onharu-review-qa.log 2>&1 &
      - run: node scripts/qa-review-labels.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onharu-review-labels-and-css-inventory
          path: |
            test-results/review-labels/
            review-css-inventory.json
          retention-days: 14
