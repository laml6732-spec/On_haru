name: On_HARU stages 4-5 responsive and accessibility geometry
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/qa-stages-mobile-a11y.mjs'
      - '.github/workflows/qa-stages-mobile-a11y.yml'
      - 'public/legacy/runtime/legacy-controllers.9a6fbb5e22cc.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive-a11y:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - run: npx playwright-core install --with-deps chromium
      - run: node --check scripts/qa-stages-mobile-a11y.mjs
      - run: python3 -m http.server 8080 --directory public > /tmp/onharu-stages-a11y.log 2>&1 &
      - run: node scripts/qa-stages-mobile-a11y.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stages-mobile-a11y-evidence
          path: test-results/stages-mobile-a11y/
          retention-days: 14
