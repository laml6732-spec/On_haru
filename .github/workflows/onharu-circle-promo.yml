name: Generate On_HARU Circle promo images
on:
  push:
    paths:
      - 'scripts/generate-circle-promo.mjs'
      - '.github/workflows/onharu-circle-promo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current app
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Check browser is available
        run: |
          command -v google-chrome || command -v chromium || (echo 'No Chrome installed' && exit 1)
      - name: Serve original app unchanged
        run: |
          python3 -m http.server 8787 --directory public >/tmp/onharu-promo-server.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:8787/legacy/ >/dev/null
      - name: Capture actual English app and render carousel
        run: node scripts/generate-circle-promo.mjs
      - name: Package five promotional PNGs
        uses: actions/upload-artifact@v4
        with:
          name: onharu-circle-five-actual-ui
          path: promo/circle/*.png
          retention-days: 7
      - name: Commit five PNGs to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A promo/circle/
          if ! git diff --cached --quiet; then
            git commit -m "assets: generate five On_HARU Circle promo PNGs"
            git push
          fi
