name: OnHaru static UI checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['public/legacy/**', 'scripts/verify-ui-static.mjs', 'scripts/audit-css.mjs', '.github/workflows/ui-static-checks.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-ui-static.mjs
      - run: node scripts/audit-css.mjs
