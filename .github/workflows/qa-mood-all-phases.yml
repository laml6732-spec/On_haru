name: On_HARU Archive Mood all phases QA
on:
  push:
    branches: ['fix/archive-mood-all-checkin-phases-2026-11-06']
    paths: ['public/legacy/**', 'scripts/qa-mood-all-phases.mjs', '.github/workflows/qa-mood-all-phases.yml']
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - run: command -v google-chrome >/dev/null || npx playwright-core install chromium
      - run: node scripts/verify-ui-static.mjs
      - run: python3 -m http.server 8080 --directory public > /tmp/onharu-mood-phases.log 2>&1 &
      - run: node scripts/qa-mood-all-phases.mjs
      - run: node scripts/qa-mood-week.mjs
      - run: node scripts/qa-checkin-archive-touch.mjs
      - run: node scripts/qa-review-hierarchy.mjs
      - run: node scripts/ui-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mood-all-phases-qa
          path: |
            test-results/mood-all-phases/
            test-results/mood-week/
            test-results/checkin-archive-touch/
            test-results/review-hierarchy/
            test-results/onharu-ui/
          retention-days: 14
