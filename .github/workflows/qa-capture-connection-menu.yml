name: OnHaru Capture Connection Menu QA
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'public/legacy/**'
      - 'scripts/qa-capture-connection-menu.mjs'
      - '.github/workflows/qa-capture-connection-menu.yml'
jobs:
  capture-connection:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - run: npx playwright-core install --with-deps chromium
      - run: node --check public/legacy/runtime/legacy-controllers.9a6fbb5e22cc.js
      - run: node --check scripts/qa-capture-connection-menu.mjs
      - run: node scripts/verify-ui-static.mjs
      - run: python3 -m http.server 8080 --directory public > /tmp/onharu-capture-qa.log 2>&1 &
      - run: node scripts/qa-capture-connection-menu.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onharu-capture-connection-qa
          path: test-results/capture-connection/
          retention-days: 14
