name: On_HARU consultant-level visual precision audit
on:
  push:
    branches: ['audit/precision-visual-qa-2026-11-05']
  workflow_dispatch:
jobs:
  precision-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - run: npx playwright-core install --with-deps chromium
      - run: python3 -m http.server 8080 --directory public > /tmp/onharu-precision-http.log 2>&1 &
      - name: Quantitative 6-config visual audit (source unchanged)
        run: node scripts/qa-precision-visual-2026-11.mjs
      - name: Source-backed WCAG target and color-contrast screening
        run: node scripts/qa-reference-standards-screening-2026-11.mjs
      - name: Upload measured geometry and source-based screening
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onharu-visual-precision-evidence
          path: |
            test-results/precision-visual/
            test-results/reference-aa-screening/
          retention-days: 14
