name: OnHaru Scripture Memory preview QA
on:
  push:
    branches:
      - 'preview/scripture-memory-v1-20261113'
      - preview/scripture-devotion-first-20261113
    paths:
      - 'public/legacy/**'
      - 'functions/legacy/nlt.js'
      - 'scripts/qa-scripture-memory.mjs'
      - '.github/workflows/qa-scripture-memory.yml'
  workflow_dispatch:

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tools
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          npx playwright-core install --with-deps chromium
      - name: Static checks
        run: node scripts/verify-ui-static.mjs
      - name: Start isolated static app
        run: python3 -m http.server 8080 --directory public > /tmp/onharu-scripture-server.log 2>&1 &
      - name: Scripture memory UI, persistence and responsiveness
        run: node scripts/qa-scripture-memory.mjs
        env:
          ONHARU_URL: http://127.0.0.1:8080/legacy/
      - name: Screenshots and results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scripture-memory-preview-qa
          path: test-results/scripture-memory/
          retention-days: 7
