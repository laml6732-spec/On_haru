name: On_HARU Check-in and Archive Mood touch regression
on:
  push:
    branches: [main, 'fix/checkin-archive-touch-2026-11-05', 'fix/review-hierarchy-qa-compat-2026-11-05']
    paths: ['public/legacy/**', 'scripts/qa-checkin-archive-touch.mjs', '.github/workflows/qa-checkin-archive-touch.yml']
  workflow_dispatch:
jobs:
  checkin-archive-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - run: command -v google-chrome >/dev/null || npx playwright-core install chromium
      - run: node scripts/verify-ui-static.mjs
      - run: python3 -m http.server 8080 --directory public > /tmp/onharu-ui.log 2>&1 &
      - run: node scripts/qa-checkin-archive-touch.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onharu-checkin-archive-touch
          path: test-results/checkin-archive-touch/
          retention-days: 14
