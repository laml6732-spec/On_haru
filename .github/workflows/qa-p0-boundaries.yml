name: On_HARU P0 boundary and recovery QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/qa-p0-boundaries.mjs'
      - '.github/workflows/qa-p0-boundaries.yml'
      - 'public/legacy/**'
  workflow_dispatch:
jobs:
  p0-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - run: npx playwright-core install --with-deps chromium
      - run: node --check scripts/qa-p0-boundaries.mjs
      - run: python3 -m http.server 8080 --directory public > /tmp/onharu-p0.log 2>&1 &
      - run: node scripts/qa-p0-boundaries.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onharu-p0-boundary-evidence
          path: test-results/p0-boundaries/
          retention-days: 14
