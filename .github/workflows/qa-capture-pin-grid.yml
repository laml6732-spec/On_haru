name: On_HARU Capture emoji grid visual regression
on:
  push:
    branches: [main, 'fix/capture-pin-visible-expanded-2026-11-05']
    paths: ['public/legacy/**', 'scripts/qa-capture-pin-grid.mjs', '.github/workflows/qa-capture-pin-grid.yml']
  workflow_dispatch:
jobs:
  verify-pin-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/verify-ui-static.mjs
      - run: python3 -m http.server 8080 --directory public > /tmp/onharu-pin-grid.log 2>&1 &
      - run: node scripts/qa-capture-pin-grid.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onharu-capture-pin-grid
          path: test-results/pin-grid/
          retention-days: 14
