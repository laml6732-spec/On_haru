name: OnHaru Important Daily preview QA
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'public/legacy/**'
      - 'scripts/qa-important-daily-preview.mjs'
      - '.github/workflows/qa-important-daily-preview.yml'
  push:
    branches: ['preview/typography-hierarchy-20261112']
    paths:
      - 'public/legacy/**'
      - 'scripts/qa-important-daily-preview.mjs'
      - '.github/workflows/qa-important-daily-preview.yml'
jobs:
  important-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/verify-ui-static.mjs
      - run: node --check public/legacy/runtime/legacy-controllers.9a6fbb5e22cc.js
      - run: node --check scripts/qa-important-daily-preview.mjs
      - run: python3 -m http.server 8080 --directory public > /tmp/onharu-important-http.log 2>&1 &
      - run: node scripts/qa-important-daily-preview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onharu-important-daily-preview
          path: test-results/important-daily-preview/
          retention-days: 14
