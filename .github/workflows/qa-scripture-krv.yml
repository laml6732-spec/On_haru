name: OnHaru Korean Scripture Data QA
on:
  push:
    branches:
      - feat/scripture-krv-local-text-20261113
      - preview/scripture-devotion-first-20261113
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - run: npx playwright-core install --with-deps chromium
      - run: python3 -m http.server 8080 --directory public > /tmp/onharu-krv-server.log 2>&1 &
      - run: node scripts/qa-scripture-krv.mjs
        env:
          ONHARU_URL: http://127.0.0.1:8080/legacy/
