name: Task importance across all due dates QA
on:
  push:
    branches: [preview/task-importance-all-due-dates-20261114]
    paths:
      - 'public/legacy/**'
      - 'scripts/qa-task-important-all-dates.mjs'
      - '.github/workflows/qa-task-important-all-dates.yml'
  workflow_dispatch:

jobs:
  browser-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/verify-ui-static.mjs
      - run: python3 -m http.server 8080 --directory public > /tmp/onharu-task-important.log 2>&1 &
      - run: node scripts/qa-task-important-all-dates.mjs
        env:
          ONHARU_URL: http://127.0.0.1:8080/legacy/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-importance-all-dates
          path: test-results/task-important-all-dates/
          retention-days: 7
