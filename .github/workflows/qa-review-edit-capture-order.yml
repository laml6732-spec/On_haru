name: OnHaru Review edit and Capture importance QA
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'public/legacy/**'
      - 'scripts/qa-review-edit-capture-order.mjs'
      - '.github/workflows/qa-review-edit-capture-order.yml'
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - run: npx playwright-core install --with-deps chromium
      - run: node --check public/legacy/runtime/legacy-controllers.9a6fbb5e22cc.js
      - run: node --check scripts/qa-review-edit-capture-order.mjs
      - run: node scripts/verify-ui-static.mjs
      - run: python3 -m http.server 8080 --directory public > /tmp/onharu-review-qa-http.log 2>&1 &
      - run: node scripts/qa-review-edit-capture-order.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-edit-capture-order
          path: test-results/review-edit-capture-order/
          retention-days: 14
